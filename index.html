<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css" />
    <title>Love Letter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <!-- Envelope Screen -->
    <div id="envelope-container">
        <img src="PinkLetter-removebg-preview.png" alt="Envelope" id="envelope">
        <p>Letter for you</p>
    </div>

    <!-- Letter Screen -->
    <div id="letter-container">
        <div class="letter-window">
            <h1 id="letter-title">Will you be my Wifey?</h1>

            <img src="PandaLoveGif.gif" class="cat" id="letter-cat" />

            <div class="buttons" id="letter-buttons">
                <img src="PinkYES-removebg-preview.png" class="btn yes-btn" alt="yes" />

                <div class="no-wrapper">
                    <img src="PinkNO-removebg-preview.png" class="btn no-btn" alt="No" />
                </div>
            </div>

            <p id="final-text" class="final-text" style="display: none">
                <strong>Shark Date:</strong>Gawr Restaurant at 7pm. Dress fancy
            </p>

        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
